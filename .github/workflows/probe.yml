name: Sonda de fuentes

# Reconocimiento manual: descarga el HTML de los sitios candidatos desde un
# runner de GitHub (que sí tiene salida a internet) y muestra los reproductores.
# No se ejecuta en cada push ni reproduce medios.
on:
  workflow_dispatch:
    inputs:
      site:
        description: 'pelis24 | fuegocine | all'
        required: false
        default: all

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sondear las fuentes
        run: node tools/probe-sites.js "${{ inputs.site }}"
