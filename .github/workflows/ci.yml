name: CI

# Se ejecuta en cada push y en cada PR: si el build o las pruebas fallan, no se
# entrega. El despliegue de Render no depende de este archivo, pero GitHub
# marca el commit en rojo y el PR no se fusiona por error.
on:
  push:
    branches: ['**']
  pull_request:
  # Ejecución manual: además de las pruebas, sondea las fuentes candidatas
  # desde el runner (que sí tiene salida a internet) para reconocer los
  # reproductores. Sin la entrada `probe`, solo corre CI.
  workflow_dispatch:
    inputs:
      probe:
        description: 'fuegocine | k-drama | framextv | kdesa | all (vacío = solo pruebas)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build y pruebas (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['20.3', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Compilar providers
        run: npm run build
      - name: Comprobar que el build no deja cambios sin confirmar
        run: git diff --exit-code -- providers manifest.json
      - name: Pruebas
        run: npm test
      - name: Comprobación de sintaxis de los bundles
        run: |
          for file in providers/*.js addon/*.js sports/*.js; do
            node --check "$file"
          done
      # Los push sí están permitidos: se activa escribiendo [probe] en el
      # mensaje del commit (o a mano con la entrada `probe`). El resultado se
      # publica como artefacto porque los registros no son accesibles aquí.
      - name: Sonda de fuentes
        if: ${{ matrix.node == '22' && (inputs.probe != '' || contains(github.event.head_commit.message, '[probe]')) }}
        run: |
          # Etiqueta del commit → ronda concreta. Las más específicas van primero.
          MSG="${{ github.event.head_commit.message }}"
          MODE="${{ inputs.probe }}"
          if [ -z "$MODE" ]; then
            for tag in dlx29 dlx28 dlx27 dlx26 dlx probe24; do
              case "$MSG" in *"[$tag]"*) MODE="$tag"; break;; esac
            done
            case "$MODE" in
              dlx29) MODE=dlx29;; dlx28) MODE=dlx28;; dlx27) MODE=dlx27;; dlx26) MODE=dlx26;;
              dlx) MODE=doramaslatinox;; probe24) MODE=round24only;; *) MODE=all;;
            esac
          fi
          node tools/probe-sites.js "$MODE" > probe.txt 2>&1 || true
      # Comprobación en vivo contra los sitios reales: se activa con [live] en
      # el mensaje del commit. Solo analiza páginas; no descarga medios.
      - name: Comprobación en vivo
        if: ${{ matrix.node == '22' && contains(github.event.head_commit.message, '[live]') }}
        run: |
          {
            node tools/live-check.js --site fuegocine --id 1368337 --type movie --title "La Odisea" --year 2026 || true
            node tools/live-check.js --site fuegocine --id 1368337 --type movie --title "Odisea" --year 1997 || true
            node tools/live-check.js --site fuegocine --id 213375 --type tv --season 1 --episode 2 --title "VisionQuest" --year 2025 --season-counts 8 || true
            node tools/live-check.js --site doramaslatinox --id 285751 --type tv --season 1 --episode 2 --title "GIFT" --year 2026 --season-counts 2 --trace || true
            node tools/live-check.js --site latanime --id 37854 --type tv --season 1 --episode 1 --title "One Piece" --year 1999 || true
            node tools/live-check.js --site pelishax --id 155 --type movie --title "The Dark Knight" --year 2008 --trace || true
            node tools/live-check.js --site pelishax --id 117376 --type tv --season 1 --episode 1 --title "Vincenzo" --year 2021 --season-counts 20 || true
            node tools/live-check.js --site homecine --id 603 --type movie --title "The Matrix" --year 1999 || true
            node tools/live-check.js --site frikiserie --id 1259 --type tv --season 1 --episode 1 --title "Los Caballeros del Zodiaco" --year 1986 --season-counts 114 || true
          } > live.txt 2>&1
      # El artefacto y los registros no son accesibles desde este entorno, así
      # que el resultado se confirma en la misma rama (con [skip ci]).
      - name: Publicar la sonda en la rama
        if: ${{ matrix.node == '22' && (inputs.probe != '' || contains(github.event.head_commit.message, '[probe]') || contains(github.event.head_commit.message, '[live]')) }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$GITHUB_REF_NAME"
          git add -f probe.txt live.txt 2>/dev/null || git add -f probe.txt
          git commit -m 'sonda de fuentes [skip ci]' || true
          git push origin "HEAD:$GITHUB_REF_NAME" || true
      - name: Arrancar el addon y comprobar el manifiesto
        run: |
          PORT=7099 node addon/server.js &
          server=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7099/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:7099/manifest.json > manifest.out.json
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("manifest.out.json", "utf8"));
            const names = m.resources.map(r => r.name).sort().join(",");
            if (names !== "catalog,meta,stream") throw new Error("resources inesperados: " + names);
            for (const type of ["movie", "series", "anime", "channel"]) {
              if (!m.types.includes(type)) throw new Error("falta el tipo " + type);
            }
            const stream = m.resources.find(r => r.name === "stream");
            for (const prefix of ["tt", "tmdb", "kitsu", "mal", "anidb", "nebula-sport:"]) {
              if (!stream.idPrefixes.includes(prefix)) throw new Error("falta el prefijo " + prefix);
            }
            console.log("manifiesto OK:", m.version, m.types.join("/"));
          '
          kill $server
