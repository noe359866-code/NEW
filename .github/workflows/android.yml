name: APK Android

on:
  push:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - run: npm run android:sync
      - name: Compilar APK y prueba de instrumentación
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Habilitar KVM para el emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instalar y probar la app en Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: cd android && ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Guardar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: Nebula-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Guardar informe de pruebas si fallan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Android-informe-pruebas
          path: android/app/build/reports/androidTests/
          if-no-files-found: ignore
