version: '3.8'

services:
  nexoplay-addon:
    build: .
    container_name: nexoplay-addon
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PROXY_BASE_URL=http://localhost:3000
    volumes:
      # Montar logs si es necesario
      - ./logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Opcional: Nginx como reverse proxy
  nginx:
    image: nginx:alpine
    container_name: nexoplay-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/nginx/ssl
    depends_on:
      - nexoplay-addon

  # Opcional: Certbot para HTTPS
  certbot:
    image: certbot/certbot
    container_name: nexoplay-certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
